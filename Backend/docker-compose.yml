services:
  postgres:
    container_name: pg-server
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ./PostgreSQL/backups:/backups
      - ./PostgreSQL/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./PostgreSQL/init:/docker-entrypoint-initdb.d/:ro
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/pg-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net

  vectordb-base:
    build:
      context: ./VectorDB
      dockerfile: Dockerfile.base
    image: vectordb-base:latest

  vectordb:
    container_name: vectordb-server
    build: 
      context: ./VectorDB
      dockerfile: Dockerfile
    volumes:
      - ./VectorDB/data:/vectordb/data:rw
    depends_on:
      vectordb-base:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.settimeout(1); result=s.connect_ex((\"localhost\", 50051)); s.close(); exit(result)'"]
      interval: 20s
      timeout: 60s
      retries: 5
      start_period: 60s
    networks:
      - backend-net
    restart: unless-stopped

  spring-app:
    container_name: spring-server
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SPRING_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      vectordb:
        condition: service_healthy
    environment:
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgres}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      
      # VectorDB Configuration
      VECTORDB_HOST: vectordb
      VECTORDB_PORT: 50051
      
      # Grok API Configuration
      GROK_API_KEY: ${GROK_API_KEY}
      GROK_API_URL: ${GROK_API_URL:-https://api.x.ai/v1/chat/completions}
      GROK_MODEL: ${GROK_MODEL:-grok-3-latest}
      
      # JVM Configuration
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1024m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
      
      # Application Configuration
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
    networks:
      - backend-net
    restart: unless-stopped
    
networks:
  backend-net:
    driver: bridge
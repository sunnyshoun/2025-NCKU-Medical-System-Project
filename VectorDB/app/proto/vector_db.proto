syntax = "proto3";

package vector_db;

service VectorDBService {
  // 搜尋知識點
  rpc SearchKnowledge (SearchRequest) returns (SearchResponse);
  // 新增知識點
  rpc AppendKnowledge (AppendRequest) returns (AppendResponse);
}

message SearchRequest {
  string query = 1;
  int32 top_k = 2; // 預設為 5，最大 50
}

message SearchResult {
  int32 rank = 1;
  string id = 2;
  float similarity = 3;
}

message SearchResponse {
  string status = 1; // "success" 或 "error"
  string message = 2; // 錯誤時提供詳細信息
  repeated SearchResult results = 3;
}

message KnowledgeData {
  string id = 1;
  string knowledge_point = 2;
  repeated string tags = 3;
  string summary = 4;
  string source = 5;
}

message AppendRequest {
  repeated KnowledgeData knowledges = 1;
}

message AppendResponse {
  string status = 1; // "success" 或 "error"
  string message = 2; // 錯誤時提供詳細信息
  repeated string new_ids = 3; // 新增成功的知識點 ID
}